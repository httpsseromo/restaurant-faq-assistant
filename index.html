<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ember & Spice Assistant</title>
  <style>
   * { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: system-ui, sans-serif; background: #f4efe9; display: flex; justify-content: center; }
.app { width: 100%; max-width: 560px; height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: #fff; }
header { padding: 14px 16px; background: #b8431c; color: #fff; }
header h1 { margin: 0; font-size: 18px; }
header p { margin: 2px 0 0; font-size: 13px; opacity: .85; }
#chat { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.bubble { max-width: 85%; padding: 10px 14px; border-radius: 16px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
.bot { background: #f1ebe4; align-self: flex-start; border-bottom-left-radius: 4px; }
.user { background: #b8431c; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
form { display: flex; gap: 8px; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid #eee; }
input { flex: 1; min-width: 0; padding: 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; }
button { padding: 0 18px; border: 0; border-radius: 12px; background: #b8431c; color: #fff; font-size: 16px; cursor: pointer; }
button:disabled { opacity: .5; cursor: not-allowed; }
@media (min-width: 600px) { .app { height: 90vh; margin-top: 5vh; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.12); } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Ember & Spice Kitchen</h1>
      <p>Ask about our menu, hours, reservations, or delivery</p>
    </header>
    <div id="chat"></div>
    <form id="form">
      <input id="input" maxlength="500" placeholder="Type your question..." autocomplete="off">
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    const history = [];
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    function addBubble(text, who) {
      const div = document.createElement("div");
      div.className = "bubble " + who;
      div.textContent = text;  // textContent (not innerHTML) so replies can't inject code
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    addBubble("Hi! I'm the Ember & Spice assistant. How can I help?", "bot");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      addBubble(text, "user");
      history.push({ role: "user", content: text });
      send.disabled = true;
      const typing = addBubble("Typing...", "bot");

      try {
        const recent = history.slice(-20);
        if (recent[0].role === "assistant") recent.shift();
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: recent }),
        });
        if (!res.ok) throw new Error("bad response");
        const data = await res.json();
        typing.textContent = data.reply;
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        typing.textContent = "Sorry, I'm having trouble right now. Please try again in a moment.";
        history.pop();  // forget the unanswered question
      }
      send.disabled = false;
      input.focus();
    });
  </script>
</body>
</html>
